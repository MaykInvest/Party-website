<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script src="js/main.js"></script>
</head>

<body>
    <header>
        <!-- O botão do modo escuro/claro: o sol e a lua. O desenho é todo feito em CSS. -->
        <button id="botao-tema" class="botao-tema" type="button" aria-label="Modo escuro" aria-pressed="false" title="Modo escuro">
            <span class="ceu" aria-hidden="true"></span>     <!-- nuvenzinhas de dia, estrelinhas de noite -->
            <span class="astro" aria-hidden="true"></span>   <!-- o sol (dia) que vira a lua (noite) -->
        </button>

        <!-- o data-text precisa ter o MESMO texto do título: é ele que desenha a sombra e o 3D -->
        <h1 data-text="Confraternizando">Confraternizando</h1>
    </header>


    <main>
        <section>
            <h2>aqui vai a galeria: o que cada pessoa pode levar para a festa</h2>
        </section>
    </main>

    <footer>

    </footer>

</body>

</html>
